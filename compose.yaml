services:
  pt-sap:
    build:
      context: .
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    ports:
      - "${PT_SAP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      PT_SAP_SECURE_COOKIE: "${PT_SAP_SECURE_COOKIE:-0}"
      PT_SAP_BASIC_AUTH: "${PT_SAP_BASIC_AUTH:-}"
    volumes:
      - ./reference:/app/reference:ro
      - pt-sap-saves:/app/saves
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pt-sap-saves:
